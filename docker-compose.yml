services:
  postgres:
    image: postgres:17-alpine
    environment:
      # Local development credentials only.
      POSTGRES_USER: thegreendiamond
      POSTGRES_PASSWORD: thegreendiamond
      POSTGRES_DB: thegreendiamond
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thegreendiamond -d thegreendiamond"]
      interval: 5s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: elasticsearch:9.2.1
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 30

  web:
    build: .
    environment:
      DATABASE_URL: postgres://thegreendiamond:thegreendiamond@postgres:5432/thegreendiamond
      ELASTICSEARCH_URL: http://elasticsearch:9200
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

volumes:
  postgres-data:
  elasticsearch-data:
